spring:
  application:
    name: autoandes-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origin: ${AUTOANDES_CORS_ORIGIN:http://localhost:4200}
  jwt:
    expiration-ms: ${AUTOANDES_JWT_EXPIRATION_MS:3600000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

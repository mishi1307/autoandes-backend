spring:
  datasource:
    url: ${AUTOANDES_DB_URL:jdbc:oracle:thin:@//localhost:1522/xepdb1}
    username: ${AUTOANDES_DB_USERNAME:AUTOANDESDB}
    password: ${AUTOANDES_DB_PASSWORD:123456}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${AUTOANDES_JWT_SECRET:AutoAndes-dev-secret-keep-local-only-2026}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true





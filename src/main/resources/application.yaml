spring:
  profiles:
    default: dev
  application:
    name: autoandes-backend
  datasource:
    url: ${AUTOANDES_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${AUTOANDES_DB_USERNAME:autoandes}
    password: ${AUTOANDES_DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
app:
  cors:
    allowed-origin: ${AUTOANDES_CORS_ORIGIN:http://localhost:4200}
  jwt:
    secret: ${AUTOANDES_JWT_SECRET:change-this-development-secret-key-at-least-32-bytes}
    expiration-ms: 3600000
springdoc:
  swagger-ui:
    path: /swagger-ui.html


